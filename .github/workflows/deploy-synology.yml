name: Deploy to Synology NAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-synology-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy the latest main commit
        shell: bash
        env:
          NAS_CONNECT_HOST: foredu.synology.me
          NAS_CONNECT_FINGERPRINT: SHA256:9v3+3XtSAkoZHySVYqk/8t0KiW8VuTEwjPSlotDsq70
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$NAS_CONNECT_HOST"
          test -n "$NAS_CONNECT_FINGERPRINT"
          test -n "$NAS_PORT"
          test -n "$NAS_USER"
          test -n "$NAS_SSH_KEY"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$NAS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1; then
            echo '::error title=Synology SSH configuration::NAS_SSH_KEY is not a valid SSH private key.'
            exit 1
          fi
          deploy_public_key="$(ssh-keygen -y -f "$HOME/.ssh/id_ed25519")"

          ssh-keyscan -T 15 -p "$NAS_PORT" -t ed25519 "$NAS_CONNECT_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts.deploy"
          chmod 600 "$HOME/.ssh/known_hosts.deploy"
          scanned_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.deploy" -E sha256 | awk 'NR == 1 { print $2 }')"
          if [ "$scanned_fingerprint" != "$NAS_CONNECT_FINGERPRINT" ]; then
            echo '::error title=Synology SSH configuration::The new NAS host key does not match the pinned fingerprint.'
            exit 1
          fi

          ssh_error_file="$(mktemp)"
          set +e
          ssh \
            -4 \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$NAS_PORT" \
            "$NAS_USER@$NAS_CONNECT_HOST" \
            'sudo -n /bin/sh /volume1/docker/literature-app/scripts/synology-auto-deploy.sh || { echo "Retrying once after updating the deployment script." >&2; sudo -n /bin/sh /volume1/docker/literature-app/scripts/synology-auto-deploy.sh; }' \
            2>"$ssh_error_file"
          ssh_status=$?
          set -e

          if [ "$ssh_status" -ne 0 ]; then
            if grep -Eq 'Permission denied|no mutual signature algorithm' "$ssh_error_file"; then
              ssh_failure='The NAS rejected the configured SSH key.'
              printf '::notice title=Synology deploy public key::%s\n' "$deploy_public_key"
            elif grep -Eq 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED' "$ssh_error_file"; then
              ssh_failure='The NAS host key does not match NAS_KNOWN_HOSTS.'
            elif grep -Eq 'Could not resolve hostname|Name or service not known|Temporary failure in name resolution' "$ssh_error_file"; then
              ssh_failure='The NAS host name could not be resolved.'
            elif grep -Eq 'Connection timed out|Operation timed out|No route to host|Connection refused|Connection reset' "$ssh_error_file"; then
              ssh_failure='The GitHub runner could not reach the NAS SSH port.'
            else
              ssh_failure="SSH deployment failed with exit code $ssh_status."
            fi
            printf '::error title=Synology SSH deployment::%s\n' "$ssh_failure"
            cat "$ssh_error_file" >&2
            exit "$ssh_status"
          fi
